# Smoke — 10 шагов, parallel (без adapter_init для быстрой проверки пайплайна)
stage: sft
run_name: sft_smoke

model_dir: submission_nllb/weights
output_dir: runs/lora/nllb
adapter_init: runs/lora/nllb/clm_smoke/final

train_file: data/processed/parallel/train.jsonl

max_train_samples: 500
min_src_chars: 5
max_src_chars: 800
max_sents: 10

seed: 42
num_train_epochs: 1
max_steps: 10
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
max_seq_length: 256
gradient_checkpointing: true
cast_norms_to_fp32: true
warmup_steps: 2

lora_r: 8
lora_alpha: 16
lora_dropout: 0.05

logging_steps: 2
save_steps: 5
save_total_limit: 1
save_only_model: true
