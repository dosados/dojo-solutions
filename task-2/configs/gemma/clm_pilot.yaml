# Stage 1 CLM — Gemma-4-E2B, pilot
stage: clm
model_type: gemma
run_name: clm_pilot

model_dir: submission/weights
output_dir: runs/lora/gemma
adapter_init: null

train_file: data/processed/mono/train.jsonl
mono_lang_weights:
  ab: 0.6
  ru: 0.4

min_chars: 20
max_chars: 4096

seed: 42
num_train_epochs: 2
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
max_seq_length: 128
# Gemma4 multimodal: на 8GB VRAM CLM (loss на всех токенах) только при 128, не 256
max_logits_to_keep: 129
loss_type: nll
completion_only_loss: false
gradient_checkpointing: true
cast_norms_to_fp32: true
low_vram: true
warmup_steps: 100

lora_r: 24
lora_alpha: 48
lora_dropout: 0.05

logging_steps: 20
save_steps: 200
save_total_limit: 2
save_only_model: true
auto_resume: true
