# Unsloth QLoRA — быстрый smoke (~200 примеров, ~5–15 мин на 8 GB)

backend: unsloth
model_dir: submission/weights
run_name: smoke_unsloth
output_dir: runs/lora

train_file: data/processed/opus100/train.jsonl
max_train_samples: 200
max_val_samples: 0
min_src_chars: 10
max_src_chars: 400

# v1 = тот же промпт, что inference (build_translation_prompt)
prompt_style: v1

lora_r: 8
lora_alpha: 16
lora_dropout: 0.05

max_seq_length: 384
load_in_4bit: true
device_map_single_gpu: true
text_only: true
offload_embedding: false
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
num_train_epochs: 1
learning_rate: 0.0002
warmup_steps: 10
logging_steps: 5
save_steps: 100
save_total_limit: 1
seed: 42

benchmark_dev_it: false
