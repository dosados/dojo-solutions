# Рабочий прогон после успешного пилота.
run_name: train_100k

model_dir: submission/weights
output_dir: runs/lora

train_file: data/processed/opus100/train.jsonl
val_file: data/processed/opus100/validation.jsonl

max_train_samples: 100000
max_val_samples: 1000
min_src_chars: 10
max_src_chars: 800

# Опционально: IT-статьи self (без article-3 Пушкин)
self_mix_file: data/processed/self/all.jsonl
self_mix_max: 50

seed: 42
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.5e-4
max_seq_length: 768
gradient_checkpointing: true
warmup_steps: 100

lora_r: 32
lora_alpha: 64
lora_dropout: 0.05

logging_steps: 20
eval_steps: 500
save_steps: 1000
save_total_limit: 3
